[package]
name = "lemma-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A deterministic motion graphics engine for numerical stories"
license = "MIT OR Apache-2.0"
default-run = "lemma"

[lib]
name = "lemma"

[[bin]]
name = "lemma"
path = "src/bin/lemma.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
glam = { version = "0.30", features = ["bytemuck"] }
png = "0.18"
pollster = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
